name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version v$version"
            exit 1
          fi

      - name: Package plugin
        run: zip -r vj-ai-kit.plugin .claude-plugin skills designs README.md LICENSE performance-cheatsheet.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: vj-ai-kit.plugin
          generate_release_notes: true
